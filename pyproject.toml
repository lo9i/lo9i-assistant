[project]
name = "assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anibal Fernandez", email = "anibaldfernandez@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "aioimaplib>=2.0.1",
    "aiosmtplib>=5.1.3",
    "aiosqlite>=0.22.1",
    "av>=12,<16",
    "certifi>=2026.7.22",
    "cron-descriptor>=2.1.1",
    "croniter>=6.2.4",
    "ddgs>=9.16.0",
    "fastapi>=0.142.1",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "huggingface-hub>=1.33.0",
    "hypercorn>=0.17",
    "kokoro-onnx>=0.6.1",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.4",
    "langchain-openai>=1.6.6",
    "langfuse>=4.15.6",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp>=2.2.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "pillow>=13.0.0",
    "playwright>=1.63.0",
    "psutil>=7.2.2",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sounddevice>=0.5.6",
    "sse-starlette>=3.5.0",
    "tokenizers>=0.23.2",
    "trafilatura>=2.2.0",
    "watchfiles>=1.3.0",
    "websockets>=16.1.1",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["clients/terminal"]

[tool.uv.sources]
assistant-terminal = { workspace = true }

[dependency-groups]
dev = [
    "assistant-terminal",
    "cryptography>=50.0.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: needs the network or large local downloads (search engines, Telegram, page rendering, speech model); run with -m live",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "clients/terminal/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]

[tool.ruff.lint.isort]
known-first-party = ["assistant", "assistant_terminal", "tests"]

[tool.pyright]
include = ["src", "clients/terminal/src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
