[project]
name = "lo9i-terminal"
version = "0.1.0"
description = "The assistant's terminal app, a client of the daemon."
requires-python = ">=3.12"
dependencies = [
    "lo9i",
    "segno>=1.6.6",
    "textual>=8.2.8",
]

[project.scripts]
lo9i = "lo9i_terminal.main:run"

[tool.uv.sources]
lo9i = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
