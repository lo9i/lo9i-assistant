<!doctype html>
<!-- Where a reply's interactive app runs (src/lib/htmlApp.ts). Framed sandboxed by the page, its origin opaque, it
     waits for the app's document from the page and shows it in a sandboxed srcdoc frame of its own, which takes on
     this policy: with frames refused too, the app can't even navigate itself to send what it holds. Its height
     reports go on to the page. -->
<meta charset="utf-8" />
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; form-action 'none'"
/>
<style>
  html,
  body {
    margin: 0;
    height: 100%;
    overflow: hidden;
  }
  iframe {
    display: block;
    border: 0;
    width: 100%;
    height: 100%;
  }
</style>
<script>
  function show(event) {
    if (event.source !== parent || typeof event.data !== "string") return;
    removeEventListener("message", show);
    const app = document.createElement("iframe");
    app.sandbox = "allow-scripts";
    app.srcdoc = event.data;
    addEventListener("message", (report) => {
      if (report.source === app.contentWindow) parent.postMessage(report.data, "*");
    });
    document.body.append(app);
  }
  addEventListener("message", show);
</script>
<body></body>
